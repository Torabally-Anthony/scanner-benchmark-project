case_id: case-docker-007-deprecated-maintainer
artifact_type: dockerfile

ground_truth:
  - id: GT-DOCKER-007
    title: Dockerfile uses deprecated MAINTAINER instruction
    category: BuildPractice
    subcategory: DeprecatedMaintainer
    severity: Low

    resource: Dockerfile

    field_path: MAINTAINER

    bad_value: benchmark@example.invalid
    expected_value: LABEL maintainer=<value>

    rationale: >
      The MAINTAINER Dockerfile instruction is deprecated.
      Maintainer information should be recorded through LABEL
      metadata instead.

    applicable_scanners:
      - checkov
      - trivy