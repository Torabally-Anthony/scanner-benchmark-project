case_id: case-helm-019-missing-network-policy
artifact_type: helm_chart

misconfigurations:
  - id: GT-HELM-019
    title: Helm chart does not define a NetworkPolicy for its workload
    category: Network
    subcategory: MissingNetworkPolicy
    severity: Medium

    resource: Deployment.benchmark.missing-network-policy-helm-demo
    field_path: NetworkPolicy.spec.podSelector
    bad_value: null
    expected_secure_value: A default-deny or workload-scoped NetworkPolicy

    rationale: >
      Without a NetworkPolicy, the workload may accept unrestricted ingress and
      initiate unrestricted egress where the cluster network plugin enforces
      policy. Explicit policy reduces lateral movement opportunities.

    applicable_scanners:
      - checkov
      - trivy
      - kubescape
