apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-image-tag-helm-demo
  namespace: {{ .Values.namespace }}
  labels:
    app: latest-image-tag-helm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latest-image-tag-helm-demo
  template:
    metadata:
      labels:
        app: latest-image-tag-helm-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: latest-image-tag-helm-demo
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: latest-image-tag-helm-demo
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
