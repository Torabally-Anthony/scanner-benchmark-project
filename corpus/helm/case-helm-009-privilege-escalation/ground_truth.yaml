case_id: case-helm-009-privilege-escalation
artifact_type: helm

ground_truth:
  - id: GT-HELM-009
    title: Helm chart permits container privilege escalation
    category: PodSecurity
    subcategory: PrivilegeEscalation
    severity: High

    resource: Deployment.default.escalation-helm-demo
    container: demo-container

    field_path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation

    bad_value: true
    expected_value: false

    rationale: >
      Allowing privilege escalation permits a process inside the
      container to gain additional privileges. Workloads should
      normally explicitly disable privilege escalation.

    applicable_scanners:
      - checkov
      - trivy
      - kubescape