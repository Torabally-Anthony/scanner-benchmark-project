apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-demo-app
  labels:
    app: privileged-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-demo-app
  template:
    metadata:
      labels:
        app: privileged-demo-app
    spec:
      containers:
        - name: demo-container
          image: nginx:1.25
          ports:
            - containerPort: 80
          securityContext:
            privileged: true