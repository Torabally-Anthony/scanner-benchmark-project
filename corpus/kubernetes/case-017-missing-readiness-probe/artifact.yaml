apiVersion: v1
kind: Pod
metadata:
  name: missing-readiness-probe-demo
  namespace: benchmark
  labels:
    app: missing-readiness-probe-demo
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: demo-container
      image: nginx:1.25.5
      imagePullPolicy: Always
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      livenessProbe:
        tcpSocket:
          port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: missing-readiness-probe-demo-deny-all
  namespace: benchmark
spec:
  podSelector:
    matchLabels:
      app: missing-readiness-probe-demo
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
